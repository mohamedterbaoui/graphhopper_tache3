name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [24, 25-ea]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test

      - name: Run Pitest Mutation Testing
        run: mvn org.pitest:pitest-maven:mutationCoverage

      - name: Extract Mutation Score
        id: mutation_score
        run: |
          if [ -f target/pit-reports/*/index.html ]; then
            SCORE=$(grep -oP '(?<=<div class="coverage_percentage">)\d+(?=%</div>)' target/pit-reports/*/index.html | head -1)
            if [ -z "$SCORE" ]; then
              # Fallback : essayer de trouver le score avec une autre méthode
              SCORE=$(grep -oP 'Line Coverage: \K\d+' target/pit-reports/*/index.html | head -1)
            fi
            echo "score=$SCORE" >> $GITHUB_OUTPUT
            echo "📊 Mutation Score: $SCORE%"
          else
            echo "❌ Rapport Pitest introuvable"
            exit 1
          fi

      - name: Display Results
        run: |
          echo "✅ Tests de mutation terminés!"
          echo "📊 Score de mutation: ${{ steps.mutation_score.outputs.score }}%"
          echo "🔧 Version Java: ${{ matrix.java-version }}"
          echo "💻 Système: ${{ runner.os }}"
