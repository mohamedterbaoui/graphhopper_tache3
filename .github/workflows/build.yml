name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [24, 25-ea]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test

      - name: Run Pitest Mutation Testing (core module only)
        timeout-minutes: 60
        run: mvn org.pitest:pitest-maven:mutationCoverage -pl core -DskipTests=false

      - name: Extract Mutation Score
        id: mutation_score
        continue-on-error: true
        run: |
          REPORT_DIR=$(find core/target/pit-reports -type d -mindepth 1 -maxdepth 1 | head -1)
          if [ -n "$REPORT_DIR" ] && [ -f "$REPORT_DIR/index.html" ]; then
            echo "Found report directory: $REPORT_DIR"
            # Try multiple methods to extract the mutation score
            SCORE=$(grep -oP '(?<=<div class="coverage_percentage">)\d+(?=%</div>)' "$REPORT_DIR/index.html" | head -1)
            if [ -z "$SCORE" ]; then
              # Try to find mutation score in the summary table
              SCORE=$(grep -oP '(?<=<td class="coverage_percentage">)\d+(?=%</td>)' "$REPORT_DIR/index.html" | head -1)
            fi
            if [ -z "$SCORE" ]; then
              # Try to extract from XML report
              XML_REPORT=$(find "$REPORT_DIR" -name "mutations.xml" | head -1)
              if [ -n "$XML_REPORT" ]; then
                SCORE=$(grep -oP '(?<=<mutationScore>)[0-9.]+(?=</mutationScore>)' "$XML_REPORT" | head -1 | cut -d. -f1)
              fi
            fi
            if [ -z "$SCORE" ]; then
              # Last resort: try to find any percentage in the HTML
              SCORE=$(grep -oP '\d+(?=%.*mutation)' "$REPORT_DIR/index.html" | head -1)
            fi
            if [ -n "$SCORE" ]; then
              echo "score=$SCORE" >> $GITHUB_OUTPUT
              echo "📊 Mutation Score: $SCORE%"
            else
              echo "⚠️ Could not extract mutation score, but report exists"
              echo "score=unknown" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ Pitest report not found in core/target/pit-reports/"
            echo "score=error" >> $GITHUB_OUTPUT
          fi

      - name: Display Results
        if: always()
        run: |
          echo "✅ Mutation testing completed!"
          SCORE="${{ steps.mutation_score.outputs.score }}"
          if [ "$SCORE" != "error" ] && [ "$SCORE" != "unknown" ]; then
            echo "📊 Mutation Score: $SCORE%"
          else
            echo "⚠️ Mutation Score: $SCORE (could not be extracted)"
          fi
          echo "🔧 Java Version: ${{ matrix.java-version }}"
          echo "💻 System: ${{ runner.os }}"
