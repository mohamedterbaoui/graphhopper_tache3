name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [24, 25-ea]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean install -DskipTests

      - name: Run Pitest Mutation Testing (core module only)
        timeout-minutes: 120
        env:
          MAVEN_OPTS: -Xmx6g -Xms2g -XX:MaxMetaspaceSize=1g
        run: mvn org.pitest:pitest-maven:mutationCoverage -pl core -am

      - name: Extract Mutation Score
        id: mutation_score
        continue-on-error: true
        run: |
          REPORT_DIR=$(find core/target/pit-reports -type d -mindepth 1 -maxdepth 1 | head -1)
          if [ -n "$REPORT_DIR" ] && [ -f "$REPORT_DIR/index.html" ]; then
            echo "Found report directory: $REPORT_DIR"
            
            # Extract mutation coverage from the Project Summary table
            # It's the 3rd column in the data row (after Line Coverage)
            SCORE=$(grep -A 10 "Mutation Coverage" "$REPORT_DIR/index.html" | grep -oP '(?<=<td>)\d+(?=% <div class="coverage_bar")' | sed -n '2p')
            
            if [ -n "$SCORE" ]; then
              echo "score=$SCORE" >> $GITHUB_OUTPUT
              echo "📊 Mutation Score: $SCORE%"
            else
              echo "⚠️ Could not extract mutation score from index.html"
              echo "score=unknown" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ Pitest report not found in core/target/pit-reports/"
            echo "score=error" >> $GITHUB_OUTPUT
          fi

      - name: Display Results
        if: always()
        run: |
          echo "✅ Mutation testing completed!"
          SCORE="${{ steps.mutation_score.outputs.score }}"
          if [ "$SCORE" != "error" ] && [ "$SCORE" != "unknown" ]; then
            echo "📊 Mutation Score: $SCORE%"
          else
            echo "⚠️ Mutation Score: $SCORE (could not be extracted)"
          fi
          echo "🔧 Java Version: ${{ matrix.java-version }}"
          echo "💻 System: ${{ runner.os }}"
