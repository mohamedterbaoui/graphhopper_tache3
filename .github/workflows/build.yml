name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [24, 25-ea]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean install -DskipTests

      - name: Run Pitest Mutation Testing (Current Commit - All Modules)
        timeout-minutes: 120
        env:
          MAVEN_OPTS: -Xmx6g -Xms2g -XX:MaxMetaspaceSize=1g
        run: mvn org.pitest:pitest-maven:mutationCoverage -pl core,navigation,client-hc,example

      - name: Extract Current Mutation Scores
        id: current_scores
        continue-on-error: true
        run: |
          # Function to extract score from a module
          extract_score() {
            local module=$1
            local REPORT_DIR=$(find $module/target/pit-reports -type d -mindepth 1 -maxdepth 1 2>/dev/null | head -1)
            
            if [ -n "$REPORT_DIR" ] && [ -f "$REPORT_DIR/index.html" ]; then
              local SCORE=$(grep -A 20 "Project Summary" "$REPORT_DIR/index.html" | grep -o '[0-9]\+% <div class="coverage_bar"' | grep -o '^[0-9]\+' | sed -n '2p')
              if [ -n "$SCORE" ]; then
                echo "$SCORE"
              else
                echo "unknown"
              fi
            else
              echo "error"
            fi
          }

          # Extract scores for each module
          CORE_SCORE=$(extract_score "core")
          NAVIGATION_SCORE=$(extract_score "navigation")
          CLIENT_HC_SCORE=$(extract_score "client-hc")
          EXAMPLE_SCORE=$(extract_score "example")

          echo "core=$CORE_SCORE" >> $GITHUB_OUTPUT
          echo "navigation=$NAVIGATION_SCORE" >> $GITHUB_OUTPUT
          echo "clienthc=$CLIENT_HC_SCORE" >> $GITHUB_OUTPUT
          echo "example=$EXAMPLE_SCORE" >> $GITHUB_OUTPUT

          echo "📊 Current Scores:"
          echo "  - Core: $CORE_SCORE%"
          echo "  - Navigation: $NAVIGATION_SCORE%"
          echo "  - Client-HC: $CLIENT_HC_SCORE%"
          echo "  - example: $EXAMPLE_SCORE%"

      - name: Checkout Previous Commit
        if: github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        run: |
          git checkout ${{ github.event.before }}

      - name: Build Previous Commit
        if: github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        run: mvn -B clean install -DskipTests

      - name: Run Pitest Mutation Testing (Previous Commit - All Modules)
        if: github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        timeout-minutes: 120
        env:
          MAVEN_OPTS: -Xmx6g -Xms2g -XX:MaxMetaspaceSize=1g
        run: mvn org.pitest:pitest-maven:mutationCoverage -pl core,navigation,client-hc,example

      - name: Extract Previous Mutation Scores
        if: github.event.before != '0000000000000000000000000000000000000000'
        id: previous_scores
        continue-on-error: true
        run: |
          # Function to extract score from a module
          extract_score() {
            local module=$1
            local REPORT_DIR=$(find $module/target/pit-reports -type d -mindepth 1 -maxdepth 1 2>/dev/null | head -1)
            
            if [ -n "$REPORT_DIR" ] && [ -f "$REPORT_DIR/index.html" ]; then
              local SCORE=$(grep -A 20 "Project Summary" "$REPORT_DIR/index.html" | grep -o '[0-9]\+% <div class="coverage_bar"' | grep -o '^[0-9]\+' | sed -n '2p')
              if [ -n "$SCORE" ]; then
                echo "$SCORE"
              else
                echo "N/A"
              fi
            else
              echo "N/A"
            fi
          }

          # Extract scores for each module
          CORE_SCORE=$(extract_score "core")
          NAVIGATION_SCORE=$(extract_score "navigation")
          CLIENT_HC_SCORE=$(extract_score "client-hc")
          EXAMPLE_SCORE=$(extract_score "example")


          echo "core=$CORE_SCORE" >> $GITHUB_OUTPUT
          echo "navigation=$NAVIGATION_SCORE" >> $GITHUB_OUTPUT
          echo "clienthc=$CLIENT_HC_SCORE" >> $GITHUB_OUTPUT
          echo "example=$EXAMPLE_SCORE" >> $GITHUB_OUTPUT

          echo "📊 Previous Scores:"
          echo "  - Core: $CORE_SCORE%"
          echo "  - Navigation: $NAVIGATION_SCORE%"
          echo "  - Client-HC: $CLIENT_HC_SCORE%"
          echo "  - example: $EXAMPLE_SCORE%"

      - name: Compare Scores and Fail on Regression
        if: always()
        run: |
          echo "======================================"
          echo " MUTATION SCORE COMPARISON"
          echo "======================================"
          echo " Java Version: ${{ matrix.java-version }}"
          echo " System: ${{ runner.os }}"
          echo ""

          # Get all scores
          CORE_CURRENT="${{ steps.current_scores.outputs.core }}"
          CORE_PREVIOUS="${{ steps.previous_scores.outputs.core }}"
          NAVIGATION_CURRENT="${{ steps.current_scores.outputs.navigation }}"
          NAVIGATION_PREVIOUS="${{ steps.previous_scores.outputs.navigation }}"
          CLIENT_HC_CURRENT="${{ steps.current_scores.outputs.clienthc }}"
          CLIENT_HC_PREVIOUS="${{ steps.previous_scores.outputs.clienthc }}"
          EXAMPLE_CURRENT="${{ steps.current_scores.outputs.example }}"
          EXAMPLE_PREVIOUS="${{ steps.previous_scores.outputs.example }}"

          FAILED=0

          # Function to compare scores
          compare_module() {
            local module_name=$1
            local current=$2
            local previous=$3
            
            echo "────────────────────────────────────"
            echo "Module: $module_name"
            echo "────────────────────────────────────"
            
            if [ "$previous" != "" ] && [ "$previous" != "N/A" ] && [ "$previous" != "error" ] && [ "$previous" != "unknown" ]; then
              echo "Previous: $previous%"
            else
              echo "Previous: N/A"
            fi
            
            if [ "$current" != "error" ] && [ "$current" != "unknown" ]; then
              echo "Current:  $current%"
            else
              echo "Current:  $current"
            fi
            
            # Calculate difference if both are valid
            if [ "$previous" != "" ] && [ "$previous" != "N/A" ] && [ "$previous" != "error" ] && [ "$previous" != "unknown" ] && \
               [ "$current" != "error" ] && [ "$current" != "unknown" ]; then
              DIFF=$((current - previous))
              if [ $DIFF -gt 0 ]; then
                echo " Result: Improvement (+$DIFF%)"
              elif [ $DIFF -lt 0 ]; then
                echo " Result: Regression ($DIFF%)"
                echo "::error::$module_name mutation score decreased from $previous% to $current% ($DIFF%)"
                return 1
              else
                echo "Result: No change"
              fi
            else
              echo " Result: Comparison not available"
            fi
            echo ""
            return 0
          }

          # Compare each module
          compare_module "CORE" "$CORE_CURRENT" "$CORE_PREVIOUS" || FAILED=1
          compare_module "NAVIGATION" "$NAVIGATION_CURRENT" "$NAVIGATION_PREVIOUS" || FAILED=1
          compare_module "CLIENT-HC" "$CLIENT_HC_CURRENT" "$CLIENT_HC_PREVIOUS" || FAILED=1
          compare_module "EXAMPLE" "$EXAMPLE_CURRENT" "$EXAMPLE_PREVIOUS" || FAILED=1

          echo "======================================"

          if [ $FAILED -eq 1 ]; then
            echo "❌ BUILD FAILED: One or more modules had mutation score regression"
            exit 1
          else
            echo "✅ All modules passed mutation score check"
          fi

      # Rickroll if failure
      - name: Suggested Solution
        if: failure()
        run: |
          echo "To learn more about the errors and how to fix them"
          echo "Visit the site https://tinyurl.com/43cts52a"
