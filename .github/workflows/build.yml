name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [24, 25-ea]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-

      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean install -DskipTests

      - name: Run Pitest Mutation Testing (Current Commit)
        timeout-minutes: 120
        env:
          MAVEN_OPTS: -Xmx6g -Xms2g -XX:MaxMetaspaceSize=1g
        run: mvn org.pitest:pitest-maven:mutationCoverage -pl core -am

      - name: Extract Current Mutation Score
        id: current_score
        continue-on-error: true
        run: |
          REPORT_DIR=$(find core/target/pit-reports -type d -mindepth 1 -maxdepth 1 | head -1)
          if [ -n "$REPORT_DIR" ] && [ -f "$REPORT_DIR/index.html" ]; then
            echo "Found report directory: $REPORT_DIR"
            SCORE=$(grep -A 10 "Mutation Coverage" "$REPORT_DIR/index.html" | grep -oP '(?<=<td>)\d+(?=% <div class="coverage_bar")' | sed -n '2p')
            
            if [ -n "$SCORE" ]; then
              echo "score=$SCORE" >> $GITHUB_OUTPUT
              echo "📊 Current Mutation Score: $SCORE%"
            else
              echo "⚠️ Could not extract mutation score from index.html"
              echo "score=unknown" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ Pitest report not found"
            echo "score=error" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Previous Commit
        if: github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        run: |
          git checkout ${{ github.event.before }}

      - name: Build Previous Commit
        if: github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        run: mvn -B clean install -DskipTests

      - name: Run Pitest Mutation Testing (Previous Commit)
        if: github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        timeout-minutes: 120
        env:
          MAVEN_OPTS: -Xmx6g -Xms2g -XX:MaxMetaspaceSize=1g
        run: mvn org.pitest:pitest-maven:mutationCoverage -pl core -am

      - name: Extract Previous Mutation Score
        if: github.event.before != '0000000000000000000000000000000000000000'
        id: previous_score
        continue-on-error: true
        run: |
          REPORT_DIR=$(find core/target/pit-reports -type d -mindepth 1 -maxdepth 1 | head -1)
          if [ -n "$REPORT_DIR" ] && [ -f "$REPORT_DIR/index.html" ]; then
            echo "Found report directory: $REPORT_DIR"
            SCORE=$(grep -A 10 "Mutation Coverage" "$REPORT_DIR/index.html" | grep -oP '(?<=<td>)\d+(?=% <div class="coverage_bar")' | sed -n '2p')
            
            if [ -n "$SCORE" ]; then
              echo "score=$SCORE" >> $GITHUB_OUTPUT
              echo "📊 Previous Mutation Score: $SCORE%"
            else
              echo "⚠️ Could not extract mutation score from index.html"
              echo "score=N/A" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ Pitest report not found"
            echo "score=N/A" >> $GITHUB_OUTPUT
          fi

      - name: Display Mutation Score Comparison
        if: always()
        run: |
          echo "======================================"
          echo "📊 MUTATION SCORE COMPARISON"
          echo "======================================"

          CURRENT="${{ steps.current_score.outputs.score }}"
          PREVIOUS="${{ steps.previous_score.outputs.score }}"

          echo "🔧 Java Version: ${{ matrix.java-version }}"
          echo "💻 System: ${{ runner.os }}"
          echo ""

          if [ "$PREVIOUS" != "" ] && [ "$PREVIOUS" != "N/A" ] && [ "$PREVIOUS" != "error" ] && [ "$PREVIOUS" != "unknown" ]; then
            echo "📈 Previous Commit: $PREVIOUS%"
          else
            echo "📈 Previous Commit: N/A (first commit or extraction failed)"
          fi

          if [ "$CURRENT" != "error" ] && [ "$CURRENT" != "unknown" ]; then
            echo "📊 Current Commit:  $CURRENT%"
          else
            echo "📊 Current Commit:  $CURRENT (extraction failed)"
          fi

          echo ""

          # Calculate difference if both scores are valid
          if [ "$PREVIOUS" != "" ] && [ "$PREVIOUS" != "N/A" ] && [ "$PREVIOUS" != "error" ] && [ "$PREVIOUS" != "unknown" ] && \
             [ "$CURRENT" != "error" ] && [ "$CURRENT" != "unknown" ]; then
            DIFF=$((CURRENT - PREVIOUS))
            if [ $DIFF -gt 0 ]; then
              echo "✅ Improvement: +$DIFF%"
            elif [ $DIFF -lt 0 ]; then
              echo "❌ Regression: $DIFF%"
              echo "======================================"
              echo ""
              echo "::error::Mutation score decreased from $PREVIOUS% to $CURRENT% (-$((DIFF * -1))%)"
              exit 1
            else
              echo "➡️  No change"
            fi
          fi

          echo "======================================"
